<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">A bill contains a list of item records</text><text x="40" y="89" font-size="20" font-weight="400">Record = named fields. List = an ordered sequence of elements.</text><rect x="55" y="130" width="890" height="480" rx="14" fill="#fff" stroke="#d2deeb"/><text x="80" y="175" font-size="29" font-weight="700">ShoppingBill (one record)</text><text x="80" y="220" font-size="23" font-weight="400">sequenceNo: SeqNo    storeName: Name</text><text x="80" y="260" font-size="23" font-weight="400">customerName: Name    totalBillValue: Amount</text><text x="80" y="308" font-size="25" font-weight="700">items: ItemList</text><path d="M245 325L245 355" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="105" y="370" width="780" height="190" rx="14" fill="#e3ecfb" stroke="#d2deeb"/><text x="130" y="407" font-size="25" font-weight="700">A list of Item records</text><text x="130" y="450" font-size="22" font-weight="400">Item 1: Rice | Food | 2 kg | Rs 40/kg | Rs 80</text><text x="130" y="493" font-size="22" font-weight="400">Item 2: Soap | Toiletries | 3 | Rs 20 | Rs 60</text><text x="130" y="537" font-size="20" font-weight="400">Each item has name, category, quantity, unitPrice, cost.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">MarksCardList contains MarksCard records; ParagraphWordList contains WordInPara.</text><text x="52" y="719" font-size="20" font-weight="400">The types of individual fields do not automatically check totals across fields.</text></svg>