<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="980" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Put the filter inside the loop</text><text x="40" y="89" font-size="20" font-weight="400">This flowchart sums only the maths marks of records labeled F.</text><rect x="330" y="110" width="180" height="54" rx="27" fill="#dcefe9" stroke="#d2deeb"/><text x="358" y="145" font-size="22" font-weight="700">Start</text><path d="M420 164L420 190" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="240" y="190" width="360" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="258" y="230" font-size="21" font-weight="700">Sum ← 0</text><path d="M420 254L420 280" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polygon points="240.0,330 420,280.0 600.0,330 420,380.0" fill="#fff1d7" stroke="#c5ae7d"/><text x="270.0" y="337" font-size="20" font-weight="700">More cards in Pile 1?</text><path d="M600 330L785 330" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="680" y="314" font-size="20" font-weight="400">No</text><rect x="790" y="303" width="180" height="54" rx="27" fill="#dcefe9" stroke="#d2deeb"/><text x="818" y="338" font-size="22" font-weight="700">End</text><path d="M420 380L420 415" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="437" y="406" font-size="20" font-weight="400">Yes</text><rect x="240" y="415" width="360" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="258" y="455" font-size="21" font-weight="700">Pick card X</text><path d="M420 479L420 520" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polygon points="240.0,570 420,520.0 600.0,570 420,620.0" fill="#fff1d7" stroke="#c5ae7d"/><text x="270.0" y="577" font-size="20" font-weight="700">X.group = F?</text><path d="M420 620L420 660" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="440" y="647" font-size="20" font-weight="400">Yes</text><rect x="240" y="660" width="360" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="258" y="700" font-size="21" font-weight="700">Sum ← Sum + X.maths</text><path d="M420 724L420 770" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="240" y="770" width="360" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="258" y="810" font-size="21" font-weight="700">Move X to Pile 2</text><path d="M600 570 H720 V802 H600" fill="none" stroke="#527084" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="554" font-size="20" font-weight="400">No</text><path d="M240 802 H100 V330 H240" fill="none" stroke="#527084" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="884" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="912" font-size="20" font-weight="400">Both branches must eventually move the card and return to the loop test.</text><text x="52" y="939" font-size="20" font-weight="400">For two groups, the No branch can update a separate group sum.</text></svg>