<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Correct arithmetic needs trustworthy inputs</text><text x="40" y="89" font-size="20" font-weight="400">A valid-looking field can still disagree with another field.</text><rect x="40" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="165" font-size="24" font-weight="700">Value rules</text><text x="60" y="208" font-size="21" font-weight="400">Mark 766: outside 0–100.</text><text x="60" y="240" font-size="21" font-weight="400">Quantity 2.1.5: invalid number.</text><rect x="510" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="165" font-size="24" font-weight="700">Relationships</text><text x="530" y="208" font-size="21" font-weight="400">3 × Rs 22 must equal Rs 66.</text><text x="530" y="240" font-size="21" font-weight="400">Total must match the subject sum.</text><rect x="40" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="417" font-size="24" font-weight="700">Context</text><text x="60" y="460" font-size="21" font-weight="400">400 g = 0.4 kg.</text><text x="60" y="492" font-size="21" font-weight="400">31 April is not a calendar date.</text><rect x="510" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="417" font-size="24" font-weight="700">Missing or duplicated</text><text x="530" y="460" font-size="21" font-weight="400">NA is not a measured zero.</text><text x="530" y="492" font-size="21" font-weight="400">Duplicate IDs need investigation.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">Flag a problem before calculating. Do not silently guess the correction.</text><text x="52" y="719" font-size="20" font-weight="400">A type check alone cannot prove that a whole record is accurate.</text></svg>