<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Use a narrower type for a particular job</text><text x="40" y="89" font-size="20" font-weight="400">All three can be stored as integers, but their meanings are different.</text><text x="55" y="153" font-size="30" font-weight="700">Integer</text><rect x="55" y="180" width="890" height="380" rx="14" fill="#e8eff7" stroke="#d2deeb"/><rect x="90" y="220" width="820" height="78" rx="14" fill="#fff" stroke="#d2deeb"/><text x="115" y="253" font-size="25" font-weight="700">SeqNo</text><text x="335" y="266" font-size="23" font-weight="400">0…Max; identifies a record</text><rect x="90" y="320" width="820" height="78" rx="14" fill="#fff" stroke="#d2deeb"/><text x="115" y="353" font-size="25" font-weight="700">Marks</text><text x="335" y="366" font-size="23" font-weight="400">0…100 for one subject</text><rect x="90" y="420" width="820" height="78" rx="14" fill="#fff" stroke="#d2deeb"/><text x="115" y="453" font-size="25" font-weight="700">Count</text><text x="335" y="466" font-size="23" font-weight="400">0,1,2,…; never negative</text><text x="65" y="612" font-size="25" font-weight="700">A subtype can restrict values and the operations allowed.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">80 + 70 = 150 is a total; it is not a valid single-subject Mark out of 100.</text><text x="52" y="719" font-size="20" font-weight="400">Choose a wider result type when an operation can leave the subtype’s range.</text></svg>