<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">A type is a contract: values + operations</text><text x="40" y="89" font-size="20" font-weight="400">Ask both “what can be stored?” and “what can be done with it?”.</text><rect x="40" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="165" font-size="24" font-weight="700">Integer</text><text x="60" y="208" font-size="21" font-weight="400">… −2, −1, 0, 1, 2 …</text><text x="60" y="240" font-size="21" font-weight="400">2 + 3 gives Integer 5.</text><rect x="510" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="165" font-size="24" font-weight="700">Boolean</text><text x="530" y="208" font-size="21" font-weight="400">True or False</text><text x="530" y="240" font-size="21" font-weight="400">2 &lt; 3 gives Boolean True.</text><rect x="40" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="417" font-size="24" font-weight="700">Character</text><text x="60" y="460" font-size="21" font-weight="400">One symbol: A, 7, .</text><text x="60" y="492" font-size="21" font-weight="400">Compare characters for equality.</text><rect x="510" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="417" font-size="24" font-weight="700">String</text><text x="530" y="460" font-size="21" font-weight="400">A sequence: &quot;Chennai&quot;</text><text x="530" y="492" font-size="21" font-weight="400">A name is not a numeric amount.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">Quoted &quot;7&quot; and numeric 7 do not have the same meaning or type.</text><text x="52" y="719" font-size="20" font-weight="400">State the division rule: exact division or quotient; never divide by zero.</text></svg>