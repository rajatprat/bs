<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">AND needs both. OR needs at least one.</text><text x="40" y="89" font-size="20" font-weight="400">Two conditions can be combined without making extra piles.</text><text x="55" y="145" font-size="25" font-weight="700">A = group is F. B = city is Chennai.</text><rect x="45" y="190" width="910" height="65" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="65" y="232" font-size="23" font-weight="700">A</text><text x="295" y="232" font-size="23" font-weight="700">B</text><text x="525" y="232" font-size="23" font-weight="700">A AND B</text><text x="755" y="232" font-size="23" font-weight="700">A OR B</text><rect x="45" y="265" width="910" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="307" font-size="23" font-weight="400">False</text><text x="295" y="307" font-size="23" font-weight="400">False</text><text x="525" y="307" font-size="23" font-weight="400">False</text><text x="755" y="307" font-size="23" font-weight="400">False</text><rect x="45" y="340" width="910" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="382" font-size="23" font-weight="400">False</text><text x="295" y="382" font-size="23" font-weight="400">True</text><text x="525" y="382" font-size="23" font-weight="400">False</text><text x="755" y="382" font-size="23" font-weight="400">True</text><rect x="45" y="415" width="910" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="457" font-size="23" font-weight="400">True</text><text x="295" y="457" font-size="23" font-weight="400">False</text><text x="525" y="457" font-size="23" font-weight="400">False</text><text x="755" y="457" font-size="23" font-weight="400">True</text><rect x="45" y="490" width="910" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="532" font-size="23" font-weight="400">True</text><text x="295" y="532" font-size="23" font-weight="400">True</text><text x="525" y="532" font-size="23" font-weight="400">True</text><text x="755" y="532" font-size="23" font-weight="400">True</text><text x="65" y="610" font-size="24" font-weight="700">Inclusive OR accepts either match and also accepts both.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">NOT reverses a Boolean value: NOT True = False.</text><text x="52" y="719" font-size="20" font-weight="400">With AND, a False first condition is enough to reject the record.</text></svg>