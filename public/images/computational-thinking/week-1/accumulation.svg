<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Count adds 1. Sum adds the card’s value.</text><text x="40" y="89" font-size="20" font-weight="400">Track both variables in the same scan of the cards.</text><text x="60" y="145" font-size="25" font-weight="700">Card maths marks: 68, 62, 57, 42</text><rect x="45" y="195" width="220" height="180" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="239" font-size="25" font-weight="700">Card 1: 68</text><text x="65" y="289" font-size="22" font-weight="400">Count = 1</text><text x="65" y="337" font-size="24" font-weight="700">Sum = 68</text><rect x="285" y="195" width="220" height="180" rx="14" fill="#fff" stroke="#d2deeb"/><text x="305" y="239" font-size="25" font-weight="700">Card 2: 62</text><text x="305" y="289" font-size="22" font-weight="400">Count = 2</text><text x="305" y="337" font-size="24" font-weight="700">Sum = 130</text><rect x="525" y="195" width="220" height="180" rx="14" fill="#fff" stroke="#d2deeb"/><text x="545" y="239" font-size="25" font-weight="700">Card 3: 57</text><text x="545" y="289" font-size="22" font-weight="400">Count = 3</text><text x="545" y="337" font-size="24" font-weight="700">Sum = 187</text><rect x="765" y="195" width="220" height="180" rx="14" fill="#fff" stroke="#d2deeb"/><text x="785" y="239" font-size="25" font-weight="700">Card 4: 42</text><text x="785" y="289" font-size="22" font-weight="400">Count = 4</text><text x="785" y="337" font-size="24" font-weight="700">Sum = 229</text><rect x="65" y="445" width="870" height="142" rx="14" fill="#e3ecfb" stroke="#d2deeb"/><text x="95" y="490" font-size="29" font-weight="700">Average = final Sum / final Count</text><text x="95" y="540" font-size="29" font-weight="700">229 / 4 = 57.25 marks</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">Initialize Count and Sum outside the loop, not again for each card.</text><text x="52" y="719" font-size="20" font-weight="400">If Count = 0, there is no average to compute: do not divide by zero.</text></svg>