<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="980" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Follow the arrows: count the cards</text><text x="40" y="89" font-size="20" font-weight="400">Oval = terminal. Rectangle = process. Diamond = decision.</text><rect x="340" y="120" width="180" height="54" rx="27" fill="#dcefe9" stroke="#d2deeb"/><text x="368" y="155" font-size="22" font-weight="700">Start</text><path d="M430 174L430 200" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="280" y="200" width="300" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="298" y="240" font-size="21" font-weight="700">Count ← 0</text><path d="M430 264L430 290" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polygon points="250.0,340 430,290.0 610.0,340 430,390.0" fill="#fff1d7" stroke="#c5ae7d"/><text x="280.0" y="347" font-size="20" font-weight="700">More cards in Pile 1?</text><path d="M610 340L775 340" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="670" y="325" font-size="20" font-weight="400">No</text><rect x="780" y="313" width="180" height="54" rx="27" fill="#dcefe9" stroke="#d2deeb"/><text x="808" y="348" font-size="22" font-weight="700">End</text><path d="M430 390L430 430" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="450" y="417" font-size="20" font-weight="400">Yes</text><rect x="280" y="430" width="300" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="298" y="470" font-size="21" font-weight="700">Pick card X</text><path d="M430 494L430 530" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="280" y="530" width="300" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="298" y="570" font-size="21" font-weight="700">Count ← Count + 1</text><path d="M430 594L430 630" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="280" y="630" width="300" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="298" y="670" font-size="21" font-weight="700">Move X to Pile 2</text><path d="M280 662 H110 V340 H250" fill="none" stroke="#527084" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="790" font-size="25" font-weight="700">The back arrow repeats the loop.</text><text x="60" y="832" font-size="25" font-weight="700">No cards left → follow No → End.</text><rect x="32" y="884" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="912" font-size="20" font-weight="400">The empty-pile test comes before trying to pick a card.</text><text x="52" y="939" font-size="20" font-weight="400">For summing, replace Count + 1 with Sum + X.mathsMarks.</text></svg>