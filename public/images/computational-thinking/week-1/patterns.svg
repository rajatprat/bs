<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Think in steps before writing a program</text><text x="40" y="89" font-size="20" font-weight="400">One useful pattern can solve problems that look very different.</text><rect x="40" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="165" font-size="24" font-weight="700">A recipe</text><text x="60" y="208" font-size="21" font-weight="400">Ingredients → ordered instructions</text><text x="60" y="240" font-size="21" font-weight="400">Clear amounts and stopping points.</text><rect x="510" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="165" font-size="24" font-weight="700">Prepare a hall</text><text x="530" y="208" font-size="21" font-weight="400">50 chairs = 5 rows × 10 chairs</text><text x="530" y="240" font-size="21" font-weight="400">“Get it ready” needs more detail.</text><rect x="40" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="417" font-size="24" font-weight="700">Hang clothes</text><text x="60" y="460" font-size="21" font-weight="400">Choose the next item.</text><text x="60" y="492" font-size="21" font-weight="400">Place it. Repeat until finished.</text><rect x="510" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="417" font-size="24" font-weight="700">Arrange books</text><text x="530" y="460" font-size="21" font-weight="400">Choose the next book.</text><text x="530" y="492" font-size="21" font-weight="400">Place it. Repeat until finished.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">An algorithm is a precise procedure with a goal and a stopping condition.</text><text x="52" y="719" font-size="20" font-weight="400">A computer follows the instructions you give, not the intention you leave unstated.</text></svg>