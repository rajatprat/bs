<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Sometimes you must finish one pass first</text><text x="40" y="89" font-size="20" font-weight="400">Keep only words whose final normalized frequency is 1.</text><rect x="40" y="125" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="150" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="182" font-size="24" font-weight="700">1</text><text x="125" y="164" font-size="24" font-weight="700">Pass 1: count every occurrence</text><text x="125" y="204" font-size="21" font-weight="400">Create and complete the frequency table.</text><rect x="40" y="250" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="275" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="307" font-size="24" font-weight="700">2</text><text x="125" y="289" font-size="24" font-weight="700">Do not decide uniqueness too early</text><text x="125" y="329" font-size="21" font-weight="400">A word seen once now may appear again later.</text><rect x="40" y="375" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="400" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="432" font-size="24" font-weight="700">3</text><text x="125" y="414" font-size="24" font-weight="700">Pass 2: consult completed counts</text><text x="125" y="454" font-size="21" font-weight="400">Keep a word only if its final count equals 1.</text><rect x="40" y="500" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="525" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="557" font-size="24" font-weight="700">4</text><text x="125" y="539" font-size="24" font-weight="700">Use the same normalization twice</text><text x="125" y="579" font-size="21" font-weight="400">Case and punctuation rules must match across both passes.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">These are two sequential passes, not one full scan inside every record visit.</text><text x="52" y="719" font-size="20" font-weight="400">The supplied table has 38 once-occurring normalized words.</text></svg>