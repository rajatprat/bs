<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">A maximum value is not the whole answer</text><text x="40" y="89" font-size="20" font-weight="400">Actual Scores data: maths maximum = 97, on cards 11 and 23.</text><rect x="40" y="125" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="150" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="182" font-size="24" font-weight="700">1</text><text x="125" y="164" font-size="24" font-weight="700">New higher score</text><text x="125" y="204" font-size="21" font-weight="400">Set Max to the score. Replace Owners with [current ID].</text><rect x="40" y="250" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="275" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="307" font-size="24" font-weight="700">2</text><text x="125" y="289" font-size="24" font-weight="700">Score equal to Max</text><text x="125" y="329" font-size="21" font-weight="400">Append the current ID to Owners.</text><rect x="40" y="375" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="400" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="432" font-size="24" font-weight="700">3</text><text x="125" y="414" font-size="24" font-weight="700">Score below Max</text><text x="125" y="454" font-size="21" font-weight="400">Leave both Max and Owners unchanged.</text><rect x="40" y="500" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="525" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="557" font-size="24" font-weight="700">4</text><text x="125" y="539" font-size="24" font-weight="700">A later new high clears the old tie</text><text x="125" y="579" font-size="21" font-weight="400">For 7,7,9,9, final owners are the two 9-cards only.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">Using &gt; with one ID retains the first maximum; &gt;= retains the last one.</text><text x="52" y="719" font-size="20" font-weight="400">To report all winners, keep a list and handle equality separately.</text></svg>