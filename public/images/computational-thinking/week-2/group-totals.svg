<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">The busiest shop need not have the most revenue</text><text x="40" y="89" font-size="20" font-weight="400">These are the totals reported in the lecture’s shopping-bill demonstration.</text><rect x="40" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="165" font-size="24" font-weight="700">SV Stores</text><text x="60" y="208" font-size="21" font-weight="400">15 bills</text><text x="60" y="240" font-size="21" font-weight="400">Revenue: Rs 7,120</text><rect x="510" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="165" font-size="24" font-weight="700">Big Bazaar</text><text x="530" y="208" font-size="21" font-weight="400">6 bills</text><text x="530" y="240" font-size="21" font-weight="400">Revenue: Rs 13,284</text><rect x="40" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="417" font-size="24" font-weight="700">Sun General</text><text x="60" y="460" font-size="21" font-weight="400">9 bills</text><text x="60" y="492" font-size="21" font-weight="400">Revenue: Rs 4,009</text><rect x="510" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="417" font-size="24" font-weight="700">Different questions</text><text x="530" y="460" font-size="21" font-weight="400">Max count = 15 (SV).</text><text x="530" y="492" font-size="21" font-weight="400">Max revenue = 13,284 (Big Bazaar).</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">One bill’s amount, a store’s revenue and its average bill are different quantities.</text><text x="52" y="719" font-size="20" font-weight="400">For nonnegative bills, store totals only rise, so the running-max shortcut works.</text></svg>