<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="980" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Draw the running-maximum procedure</text><text x="40" y="89" font-size="20" font-weight="400">Keep value and owner updates together on the same branch.</text><rect x="270" y="125" width="360" height="62" rx="28" fill="#dcefe9" stroke="#d2deeb"/><text x="295" y="164" font-size="22" font-weight="700">Start: HaveValue ← False</text><path d="M450 187L450 220" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polygon points="260.0,270 450,220.0 640.0,270 450,320.0" fill="#fff1d7" stroke="#c5ae7d"/><text x="285.0" y="277" font-size="19" font-weight="700">More cards?</text><path d="M640 270L790 270" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="682" y="250" font-size="20" font-weight="400">No</text><rect x="795" y="243" width="170" height="58" rx="28" fill="#dcefe9" stroke="#d2deeb"/><text x="817" y="280" font-size="20" font-weight="700">Report / End</text><path d="M450 320L450 360" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="346" font-size="20" font-weight="400">Yes</text><rect x="270" y="360" width="360" height="64" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="288" y="400" font-size="21" font-weight="700">Read X; move to Pile 2</text><path d="M450 424L450 470" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polygon points="210.0,530 450,470.0 690.0,530 450,590.0" fill="#fff1d7" stroke="#c5ae7d"/><text x="235.0" y="537" font-size="19" font-weight="700">First value OR X.score &gt; Max?</text><path d="M450 590L450 635" stroke="#527084" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="470" y="622" font-size="20" font-weight="400">Yes</text><rect x="240" y="635" width="420" height="95" rx="3" fill="#e3ecfb" stroke="#d2deeb"/><text x="260" y="673" font-size="22" font-weight="700">Max ← X.score; Owner ← X.id</text><text x="260" y="711" font-size="22" font-weight="700">HaveValue ← True</text><path d="M450 730 V790 H100 V270 H260" fill="none" stroke="#527084" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 530 H740 V790 H450" fill="none" stroke="#527084" stroke-width="3" marker-end="url(#arrow)"/><text x="713" y="510" font-size="20" font-weight="400">No</text><text x="75" y="844" font-size="23" font-weight="700">No data? Report no maximum, not a fictitious score.</text><rect x="32" y="884" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="912" font-size="20" font-weight="400">For all ties, add an equality decision and append matching IDs.</text><text x="52" y="939" font-size="20" font-weight="400">The first-record branch handles zero and negative values correctly.</text></svg>