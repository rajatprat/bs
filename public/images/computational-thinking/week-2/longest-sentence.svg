<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Reset the local count, keep the global best</text><text x="40" y="89" font-size="20" font-weight="400">Count every word, including the word carrying the full stop.</text><text x="70" y="150" font-size="26" font-weight="700">Actual sentence lengths from Words.pdf</text><rect x="50" y="190" width="900" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="75" y="232" font-size="23" font-weight="700">Sentence 1</text><text x="350" y="232" font-size="23" font-weight="400">Count = 4</text><text x="650" y="232" font-size="23" font-weight="700">Longest = 4</text><rect x="50" y="268" width="900" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="75" y="310" font-size="23" font-weight="700">Sentence 2</text><text x="350" y="310" font-size="23" font-weight="400">Count = 7</text><text x="650" y="310" font-size="23" font-weight="700">Longest = 7</text><rect x="50" y="346" width="900" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="75" y="388" font-size="23" font-weight="700">Sentence 3</text><text x="350" y="388" font-size="23" font-weight="400">Count = 8</text><text x="650" y="388" font-size="23" font-weight="700">Longest = 8</text><rect x="50" y="424" width="900" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="75" y="466" font-size="23" font-weight="700">Sentence 4</text><text x="350" y="466" font-size="23" font-weight="400">Count = 21</text><text x="650" y="466" font-size="23" font-weight="700">Longest = 21</text><rect x="50" y="502" width="900" height="65" rx="14" fill="#fff" stroke="#d2deeb"/><text x="75" y="544" font-size="23" font-weight="700">Sentence 5</text><text x="350" y="544" font-size="23" font-weight="400">Count = 25</text><text x="650" y="544" font-size="23" font-weight="700">Longest = 25</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">At each full stop: compare Count with Longest, then reset Count to 0.</text><text x="52" y="719" font-size="20" font-weight="400">The supplied table’s fourth sentence has 21 words; the lecture says 20.</text></svg>