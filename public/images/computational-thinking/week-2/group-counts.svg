<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Keep one counter for each category</text><text x="40" y="89" font-size="20" font-weight="400">A group may reappear after many other records. Keep its earlier count.</text><text x="65" y="150" font-size="26" font-weight="700">Store labels: A, B, A, C, B, A</text><rect x="45" y="190" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="228" font-size="22" font-weight="700">Visit 1: A</text><text x="270" y="228" font-size="22" font-weight="400">A: 1    B: 0    C: 0</text><text x="680" y="228" font-size="22" font-weight="700">MaxCount: 1</text><rect x="45" y="258" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="296" font-size="22" font-weight="700">Visit 2: B</text><text x="270" y="296" font-size="22" font-weight="400">A: 1    B: 1    C: 0</text><text x="680" y="296" font-size="22" font-weight="700">MaxCount: 1</text><rect x="45" y="326" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="364" font-size="22" font-weight="700">Visit 3: A</text><text x="270" y="364" font-size="22" font-weight="400">A: 2    B: 1    C: 0</text><text x="680" y="364" font-size="22" font-weight="700">MaxCount: 2</text><rect x="45" y="394" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="432" font-size="22" font-weight="700">Visit 4: C</text><text x="270" y="432" font-size="22" font-weight="400">A: 2    B: 1    C: 1</text><text x="680" y="432" font-size="22" font-weight="700">MaxCount: 2</text><rect x="45" y="462" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="500" font-size="22" font-weight="700">Visit 5: B</text><text x="270" y="500" font-size="22" font-weight="400">A: 2    B: 2    C: 1</text><text x="680" y="500" font-size="22" font-weight="700">MaxCount: 2</text><rect x="45" y="530" width="910" height="58" rx="14" fill="#fff" stroke="#d2deeb"/><text x="65" y="568" font-size="22" font-weight="700">Visit 6: A</text><text x="270" y="568" font-size="22" font-weight="400">A: 3    B: 2    C: 1</text><text x="680" y="568" font-size="22" font-weight="700">MaxCount: 3</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">New category → create count 0, then increment once for the current record.</text><text x="52" y="719" font-size="20" font-weight="400">Only the changed count needs comparison with MaxCount.</text></svg>