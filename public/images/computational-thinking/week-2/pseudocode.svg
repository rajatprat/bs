<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Replace arrows with structured text</text><text x="40" y="89" font-size="20" font-weight="400">Use blocks to show repeated and conditional actions.</text><rect x="40" y="125" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="150" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="182" font-size="24" font-weight="700">1</text><text x="125" y="164" font-size="24" font-weight="700">Assignment</text><text x="125" y="204" font-size="21" font-weight="400">Count = 0 sets a value. Count = Count + 1 updates it.</text><rect x="40" y="250" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="275" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="307" font-size="24" font-weight="700">2</text><text x="125" y="289" font-size="24" font-weight="700">Repeated execution</text><text x="125" y="329" font-size="21" font-weight="400">while (more cards) { … } checks again after each visit.</text><rect x="40" y="375" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="400" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="432" font-size="24" font-weight="700">3</text><text x="125" y="414" font-size="24" font-weight="700">Conditional execution</text><text x="125" y="454" font-size="21" font-weight="400">if (X.CityTown == &quot;Chennai&quot;) { … } runs only on a match.</text><rect x="40" y="500" width="920" height="108" rx="14" fill="#fff" stroke="#d2deeb"/><rect x="57" y="525" width="48" height="48" rx="24" fill="#dcefe9" stroke="#d2deeb"/><text x="73" y="557" font-size="24" font-weight="700">4</text><text x="125" y="539" font-size="24" font-weight="700">Field access and equality</text><text x="125" y="579" font-size="21" font-weight="400">X.Mathematics selects a field; == tests equality.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">In this week’s course notation, = assigns while == compares.</text><text x="52" y="719" font-size="20" font-weight="400">Week 1’s assignment arrow ← means the same update as = here.</text></svg>