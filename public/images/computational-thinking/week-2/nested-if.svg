<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527084"/></marker></defs><rect width="1000" height="760" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Keep the else attached to the right question</text><text x="40" y="89" font-size="20" font-weight="400">A Chennai-only group split cannot become one combined if–else.</text><rect x="40" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="165" font-size="24" font-weight="700">Original condition scope</text><text x="60" y="208" font-size="21" font-weight="400">If city is Chennai:</text><text x="60" y="240" font-size="21" font-weight="400">    if F: FCount++; else: MCount++</text><rect x="510" y="125" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="165" font-size="24" font-weight="700">Unsafe rewrite</text><text x="530" y="208" font-size="21" font-weight="400">If Chennai AND F: FCount++</text><text x="530" y="240" font-size="21" font-weight="400">Else: MCount++</text><rect x="40" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="60" y="417" font-size="24" font-weight="700">Counterexample</text><text x="60" y="460" font-size="21" font-weight="400">A Madurai record labeled F:</text><text x="60" y="492" font-size="21" font-weight="400">Original: neither. Rewrite: MCount.</text><rect x="510" y="377" width="450" height="225" rx="14" fill="#fff" stroke="#d2deeb"/><text x="530" y="417" font-size="24" font-weight="700">Safe alternatives</text><text x="530" y="460" font-size="21" font-weight="400">Keep the outer Chennai test.</text><text x="530" y="492" font-size="21" font-weight="400">Or use two complete group filters.</text><rect x="32" y="664" width="936" height="70" rx="14" fill="#dcefe9" stroke="#d2deeb"/><text x="52" y="692" font-size="20" font-weight="400">Nested if without an else can often become one AND condition.</text><text x="52" y="719" font-size="20" font-weight="400">With else branches, check which condition is being negated before rewriting.</text></svg>