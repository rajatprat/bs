    <circle id="circle" r="42" fill="#edf4fc" stroke="#365b87" stroke-width="3"/>
    <ellipse id="ellipse" rx="84" ry="21" fill="#edf4fc" stroke="#365b87" stroke-width="3"/>
    <marker id="tip" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
