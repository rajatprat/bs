      <rect x="328" y="52" width="296" height="218" rx="12"/>
      <rect x="16" y="286" width="296" height="218" rx="12"/>
      <rect x="328" y="286" width="296" height="218" rx="12"/>
    </g>
    <g font-size="21" font-weight="700">
      <text x="32" y="83">1. Start with a unit circle</text>
      <text x="344" y="83">2. Turn with Vᵀ</text>
      <text x="32" y="317">3. Scale with Σ</text>
      <text x="344" y="317">4. Turn with U</text>
    </g>
    <g font-size="19" text-anchor="middle">
      <text x="164" y="252">Arrow length = 1</text>
      <text x="476" y="252">Arrow length = 1</text>
