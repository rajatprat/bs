<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b;font-size:21px}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}</style><text x="40" y="52" class="title">A snapshot or a story through time?</text><text x="40" y="88">Illustrative temperatures in °C: notice what changes along the bottom axis.</text><rect x="45" y="125" width="425" height="450" rx="16" fill="white" stroke="#ccd9e6"/><text x="65" y="167" class="label">Different cities, same day</text><text x="65" y="207">Temperature (°C)</text><path d="M 110 485 H 440" stroke="#d4dfea"/><text x="65" y="492">0</text><path d="M 110 425 H 440" stroke="#d4dfea"/><text x="65" y="432">10</text><path d="M 110 365 H 440" stroke="#d4dfea"/><text x="65" y="372">20</text><path d="M 110 305 H 440" stroke="#d4dfea"/><text x="65" y="312">30</text><path d="M 110 245 H 440" stroke="#d4dfea"/><text x="65" y="252">40</text><rect x="130" y="305" width="50" height="180" rx="3" fill="#328478"/><text x="125" y="525">City A</text><text x="143" y="289">30</text><rect x="240" y="281" width="50" height="204" rx="3" fill="#328478"/><text x="235" y="525">City B</text><text x="253" y="265">34</text><rect x="350" y="293" width="50" height="192" rx="3" fill="#328478"/><text x="345" y="525">City C</text><text x="363" y="277">32</text><text x="65" y="561" class="label">Cross-sectional</text><rect x="530" y="125" width="425" height="450" rx="16" fill="white" stroke="#ccd9e6"/><text x="550" y="167" class="label">Same city, different days</text><text x="550" y="207">Temperature (°C)</text><path d="M 595 485 H 925" stroke="#d4dfea"/><text x="550" y="492">0</text><path d="M 595 425 H 925" stroke="#d4dfea"/><text x="550" y="432">10</text><path d="M 595 365 H 925" stroke="#d4dfea"/><text x="550" y="372">20</text><path d="M 595 305 H 925" stroke="#d4dfea"/><text x="550" y="312">30</text><path d="M 595 245 H 925" stroke="#d4dfea"/><text x="550" y="252">40</text><text x="610" y="525">Mon</text><text x="628" y="289">30</text><text x="720" y="525">Tue</text><text x="738" y="265">34</text><text x="830" y="525">Wed</text><text x="848" y="277">32</text><polyline points="640,305 750,281 860,293" fill="none" stroke="#507dd0" stroke-width="4"/><circle cx="640" cy="305" r="7" fill="#507dd0"/><circle cx="750" cy="281" r="7" fill="#507dd0"/><circle cx="860" cy="293" r="7" fill="#507dd0"/><text x="550" y="561" class="label">Time series: keep time order</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652">A timeplot has chronological time on the horizontal axis.</text><text x="52" y="679">The same numbers can describe different structures. Always read the context.</text></svg>