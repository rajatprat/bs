<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">A line predicts; points can miss it</text><text x="40" y="89" font-size="20" font-weight="400">Illustrative data: (1,2), (2,2.5), (3,4), (4,4.5).</text><path d="M120 535 L880 535" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M120 535 L120 205" stroke="#9aafbf" stroke-width="2" fill="none"/><text x="120" y="175" font-size="22" font-weight="400">y (teaching units)</text><text x="435.0" y="595" font-size="22" font-weight="400">x (teaching units)</text><text x="111.0" y="564" font-size="18" font-weight="400">0</text><text x="68" y="541.0" font-size="18" font-weight="400">0</text><text x="263.0" y="564" font-size="18" font-weight="400">1</text><text x="68" y="475.0" font-size="18" font-weight="400">1.2</text><text x="415.0" y="564" font-size="18" font-weight="400">2</text><text x="68" y="409.0" font-size="18" font-weight="400">2.4</text><text x="567.0" y="564" font-size="18" font-weight="400">3</text><text x="68" y="343.0" font-size="18" font-weight="400">3.6</text><text x="719.0" y="564" font-size="18" font-weight="400">4</text><text x="68" y="277.0" font-size="18" font-weight="400">4.8</text><text x="871.0" y="564" font-size="18" font-weight="400">5</text><text x="68" y="211.0" font-size="18" font-weight="400">6</text><circle cx="272.0" cy="425.0" r="8" fill="#328478"/><circle cx="424.0" cy="397.5" r="8" fill="#328478"/><circle cx="576.0" cy="315.0" r="8" fill="#328478"/><circle cx="728.0" cy="287.5" r="8" fill="#328478"/><path d="M120 480.0 L880 232.5" stroke="#507dd0" stroke-width="4" fill="none"/><text x="480" y="200" font-size="25" font-weight="700">Predicted y = 1 + 0.9x</text><path d="M576.0 315.0 L576.0 331.5" stroke="#ce7392" stroke-width="5" fill="none"/><text x="594.0" y="343.0" font-size="19" font-weight="400">Residual = 4 − 3.7 = 0.3</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Slope = predicted change in y when x rises by one unit.</text><text x="52" y="679" font-size="20" font-weight="400">Residual = observed y − predicted y. A fit is not a guarantee.</text></svg>