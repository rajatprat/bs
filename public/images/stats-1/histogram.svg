<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">A histogram shows where numbers collect</text><text x="40" y="89" font-size="20" font-weight="400">Lecture grouped table: 50 marks, using class widths of 10.</text><text x="45" y="140" font-size="21" font-weight="400">Frequency</text><path d="M110 540 L920 540" stroke="#d5dfe8" stroke-width="1" fill="none"/><text x="65" y="547" font-size="20" font-weight="400">0</text><path d="M110 455 L920 455" stroke="#d5dfe8" stroke-width="1" fill="none"/><text x="65" y="462" font-size="20" font-weight="400">5</text><path d="M110 370 L920 370" stroke="#d5dfe8" stroke-width="1" fill="none"/><text x="65" y="377" font-size="20" font-weight="400">10</text><path d="M110 285 L920 285" stroke="#d5dfe8" stroke-width="1" fill="none"/><text x="65" y="292" font-size="20" font-weight="400">15</text><path d="M110 200 L920 200" stroke="#d5dfe8" stroke-width="1" fill="none"/><text x="65" y="207" font-size="20" font-weight="400">20</text><rect x="130" y="489" width="125" height="51" fill="#507dd0" stroke="white"/><text x="178" y="479" font-size="23" font-weight="700">3</text><text x="120" y="575" font-size="21" font-weight="400">30</text><rect x="255" y="438" width="125" height="102" fill="#507dd0" stroke="white"/><text x="303" y="428" font-size="23" font-weight="700">6</text><text x="245" y="575" font-size="21" font-weight="400">40</text><rect x="380" y="234" width="125" height="306" fill="#507dd0" stroke="white"/><text x="428" y="224" font-size="23" font-weight="700">18</text><text x="370" y="575" font-size="21" font-weight="400">50</text><rect x="505" y="251" width="125" height="289" fill="#507dd0" stroke="white"/><text x="553" y="241" font-size="23" font-weight="700">17</text><text x="495" y="575" font-size="21" font-weight="400">60</text><rect x="630" y="472" width="125" height="68" fill="#507dd0" stroke="white"/><text x="678" y="462" font-size="23" font-weight="700">4</text><text x="620" y="575" font-size="21" font-weight="400">70</text><rect x="755" y="506" width="125" height="34" fill="#507dd0" stroke="white"/><text x="803" y="496" font-size="23" font-weight="700">2</text><text x="745" y="575" font-size="21" font-weight="400">80</text><text x="870" y="575" font-size="21" font-weight="400">90</text><text x="345" y="607" font-size="21" font-weight="400">Marks (equal-width intervals)</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Touching intervals stay in numerical order. No Pareto sorting.</text><text x="52" y="679" font-size="20" font-weight="400">For equal-width classes, heights can be counts or relative frequencies.</text></svg>