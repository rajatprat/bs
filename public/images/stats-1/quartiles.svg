<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">The box covers the middle half</text><text x="40" y="89" font-size="20" font-weight="400">Teaching boxplot uses the lecture hand-rule quartiles.</text><text x="60" y="160" font-size="26" font-weight="700">Hand-rule five-number summary</text><text x="60" y="205" font-size="23" font-weight="400">Minimum 35 | Q1 47 | Median 63.5 | Q3 68 | Maximum 79</text><path d="M100 390 L925 390" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M175 390 L835 390" stroke="#328478" stroke-width="4" fill="none"/><path d="M175 350 L175 430" stroke="#328478" stroke-width="4" fill="none"/><path d="M835 350 L835 430" stroke="#328478" stroke-width="4" fill="none"/><rect x="355" y="320" width="315" height="140" rx="10" fill="#cce3db"/><path d="M602.5 320 L602.5 460" stroke="#17314b" stroke-width="4" fill="none"/><text x="155" y="500" font-size="22" font-weight="400">35</text><text x="335" y="500" font-size="22" font-weight="400">47</text><text x="582.5" y="500" font-size="22" font-weight="400">63.5</text><text x="650" y="500" font-size="22" font-weight="400">68</text><text x="815" y="500" font-size="22" font-weight="400">79</text><text x="155" y="570" font-size="28" font-weight="700">IQR = Q3 − Q1 = 68 − 47 = 21</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">A five-number summary: minimum, Q1, median, Q3, maximum.</text><text x="52" y="679" font-size="20" font-weight="400">A modified boxplot uses fences to flag potential outliers separately.</text></svg>