<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Keep the original numbers in a small picture</text><text x="40" y="89" font-size="20" font-weight="400">Each leaf is one observation. Repeated values need repeated leaves.</text><text x="75" y="160" font-size="24" font-weight="700">Ages: 15, 22, 29, 36, 31, 23, 45, 10, 25, 28, 48</text><text x="160" y="225" font-size="23" font-weight="700">Stem (tens)</text><text x="430" y="225" font-size="23" font-weight="700">Leaves (ones), sorted</text><path d="M380 245 L380 550" stroke="#9aafbf" stroke-width="2" fill="none"/><text x="220" y="290" font-size="32" font-weight="700">1</text><text x="430" y="290" font-size="30" font-weight="400">0   5</text><text x="220" y="365" font-size="32" font-weight="700">2</text><text x="430" y="365" font-size="30" font-weight="400">2   3   5   8   9</text><text x="220" y="440" font-size="32" font-weight="700">3</text><text x="430" y="440" font-size="30" font-weight="400">1   6</text><text x="220" y="515" font-size="32" font-weight="700">4</text><text x="430" y="515" font-size="30" font-weight="400">5   8</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Key: 2 | 3 means 23 years. A key gives the digits their meaning.</text><text x="52" y="679" font-size="20" font-weight="400">There are 11 leaves, so all 11 patients are represented.</text></svg>