<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">A pie chart cuts one whole into shares</text><text x="40" y="88" class="sub">10 responses. Each response belongs to exactly one category.</text><path d="M 270 345 L 270.0 160.0 A 185 185 0 0 1 378.74027167410753 494.66814395936524 Z" fill="#328478" stroke="white" stroke-width="3"/><text x="357" y="318" class="label">A</text><rect x="540" y="170" width="22" height="22" rx="4" fill="#328478"/><text x="580" y="190" class="label">A: 40% = 144°</text><path d="M 270 345 L 378.74027167410753 494.66814395936524 A 185 185 0 0 1 161.2597283258925 494.66814395936524 Z" fill="#507dd0" stroke="white" stroke-width="3"/><text x="252" y="462" class="label">B</text><rect x="540" y="255" width="22" height="22" rx="4" fill="#507dd0"/><text x="580" y="275" class="label">B: 20% = 72°</text><path d="M 270 345 L 161.2597283258925 494.66814395936524 A 185 185 0 0 1 94.05454448539658 287.83185604063476 Z" fill="#e5ac47" stroke="white" stroke-width="3"/><text x="147" y="386" class="label">C</text><rect x="540" y="340" width="22" height="22" rx="4" fill="#e5ac47"/><text x="580" y="360" class="label">C: 20% = 72°</text><path d="M 270 345 L 94.05454448539658 287.83185604063476 A 185 185 0 0 1 269.99999999999994 160.0 Z" fill="#ce7392" stroke="white" stroke-width="3"/><text x="187" y="263" class="label">D</text><rect x="540" y="425" width="22" height="22" rx="4" fill="#ce7392"/><text x="580" y="445" class="label">D: 20% = 72°</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Slice angle = relative frequency × 360°.</text><text x="52" y="679" class="small">A is 40% of the whole; it is less than half.</text></svg>