<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Compare shares when group sizes differ</text><text x="40" y="89" font-size="20" font-weight="400">Each bar is 100% of its income group, not the same number of people.</text><text x="75" y="160" font-size="24" font-weight="700">Owns smartphone</text><rect x="660" y="138" width="25" height="25" rx="10" fill="#328478"/><text x="705" y="160" font-size="21" font-weight="400">Yes</text><rect x="800" y="138" width="25" height="25" rx="10" fill="#e5ac47"/><text x="842" y="160" font-size="21" font-weight="400">No</text><text x="65" y="260" font-size="23" font-weight="700">Low</text><rect x="220" y="225" width="232.14285714285714" height="55" rx="10" fill="#328478"/><rect x="452.1428571428571" y="225" width="417.85714285714283" height="55" rx="10" fill="#e5ac47"/><text x="225" y="312" font-size="21" font-weight="400">5/14 ≈ 35.71% own a phone</text><text x="65" y="375" font-size="23" font-weight="700">Medium</text><rect x="220" y="340" width="384.0909090909091" height="55" rx="10" fill="#328478"/><rect x="604.0909090909091" y="340" width="265.9090909090909" height="55" rx="10" fill="#e5ac47"/><text x="225" y="427" font-size="21" font-weight="400">39/66 ≈ 59.09% own a phone</text><text x="65" y="490" font-size="23" font-weight="700">High</text><rect x="220" y="455" width="585.0" height="55" rx="10" fill="#328478"/><rect x="805.0" y="455" width="64.99999999999999" height="55" rx="10" fill="#e5ac47"/><text x="225" y="542" font-size="21" font-weight="400">18/20 ≈ 90.00% own a phone</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Income groups have phone-ownership shares of about 36%, 59%, 90%.</text><text x="52" y="679" font-size="20" font-weight="400">These sample patterns describe association; they do not prove causation.</text></svg>