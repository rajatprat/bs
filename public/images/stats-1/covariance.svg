<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Do the deviations have the same sign?</text><text x="40" y="89" font-size="20" font-weight="400">Deviation means “value minus its mean”. Multiply paired deviations.</text><path d="M500 160 L500 565" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M120 365 L890 365" stroke="#9aafbf" stroke-width="2" fill="none"/><text x="145" y="205" font-size="23" font-weight="700">x low, y high: product −</text><text x="540" y="205" font-size="23" font-weight="700">x high, y high: product +</text><text x="145" y="485" font-size="23" font-weight="700">x low, y low: product +</text><text x="540" y="485" font-size="23" font-weight="700">x high, y low: product −</text><text x="515" y="145" font-size="21" font-weight="400">x = mean x</text><text x="105" y="355" font-size="21" font-weight="400">y = mean y</text><circle cx="300" cy="430" r="10" fill="#328478"/><circle cx="380" cy="400" r="10" fill="#328478"/><circle cx="620" cy="290" r="10" fill="#328478"/><circle cx="740" cy="240" r="10" fill="#328478"/><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Same signs give a positive product. Opposite signs give a negative product.</text><text x="52" y="679" font-size="20" font-weight="400">Covariance adds these products, then divides by N or n − 1.</text></svg>