<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17314b">A small group can tell a bigger story</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">Start by defining the whole group you want to understand.</text><rect x="45" y="130" width="440" height="420" rx="20" fill="white" stroke="#ccd9e6"/><text x="70" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17314b">Population: 1,000 students</text><text x="70" y="205" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17314b">Each dot stands for 10 students.</text><circle cx="85" cy="245" r="9" fill="#328478"/><circle cx="122" cy="245" r="9" fill="#328478"/><circle cx="159" cy="245" r="9" fill="#328478"/><circle cx="196" cy="245" r="9" fill="#328478"/><circle cx="233" cy="245" r="9" fill="#328478"/><circle cx="270" cy="245" r="9" fill="#d9e3ed"/><circle cx="307" cy="245" r="9" fill="#d9e3ed"/><circle cx="344" cy="245" r="9" fill="#d9e3ed"/><circle cx="381" cy="245" r="9" fill="#d9e3ed"/><circle cx="418" cy="245" r="9" fill="#d9e3ed"/><circle cx="85" cy="273" r="9" fill="#328478"/><circle cx="122" cy="273" r="9" fill="#328478"/><circle cx="159" cy="273" r="9" fill="#328478"/><circle cx="196" cy="273" r="9" fill="#328478"/><circle cx="233" cy="273" r="9" fill="#328478"/><circle cx="270" cy="273" r="9" fill="#d9e3ed"/><circle cx="307" cy="273" r="9" fill="#d9e3ed"/><circle cx="344" cy="273" r="9" fill="#d9e3ed"/><circle cx="381" cy="273" r="9" fill="#d9e3ed"/><circle cx="418" cy="273" r="9" fill="#d9e3ed"/><circle cx="85" cy="301" r="9" fill="#d9e3ed"/><circle cx="122" cy="301" r="9" fill="#d9e3ed"/><circle cx="159" cy="301" r="9" fill="#d9e3ed"/><circle cx="196" cy="301" r="9" fill="#d9e3ed"/><circle cx="233" cy="301" r="9" fill="#d9e3ed"/><circle cx="270" cy="301" r="9" fill="#d9e3ed"/><circle cx="307" cy="301" r="9" fill="#d9e3ed"/><circle cx="344" cy="301" r="9" fill="#d9e3ed"/><circle cx="381" cy="301" r="9" fill="#d9e3ed"/><circle cx="418" cy="301" r="9" fill="#d9e3ed"/><circle cx="85" cy="329" r="9" fill="#d9e3ed"/><circle cx="122" cy="329" r="9" fill="#d9e3ed"/><circle cx="159" cy="329" r="9" fill="#d9e3ed"/><circle cx="196" cy="329" r="9" fill="#d9e3ed"/><circle cx="233" cy="329" r="9" fill="#d9e3ed"/><circle cx="270" cy="329" r="9" fill="#d9e3ed"/><circle cx="307" cy="329" r="9" fill="#d9e3ed"/><circle cx="344" cy="329" r="9" fill="#d9e3ed"/><circle cx="381" cy="329" r="9" fill="#d9e3ed"/><circle cx="418" cy="329" r="9" fill="#d9e3ed"/><circle cx="85" cy="357" r="9" fill="#d9e3ed"/><circle cx="122" cy="357" r="9" fill="#d9e3ed"/><circle cx="159" cy="357" r="9" fill="#d9e3ed"/><circle cx="196" cy="357" r="9" fill="#d9e3ed"/><circle cx="233" cy="357" r="9" fill="#d9e3ed"/><circle cx="270" cy="357" r="9" fill="#d9e3ed"/><circle cx="307" cy="357" r="9" fill="#d9e3ed"/><circle cx="344" cy="357" r="9" fill="#d9e3ed"/><circle cx="381" cy="357" r="9" fill="#d9e3ed"/><circle cx="418" cy="357" r="9" fill="#d9e3ed"/><circle cx="85" cy="385" r="9" fill="#d9e3ed"/><circle cx="122" cy="385" r="9" fill="#d9e3ed"/><circle cx="159" cy="385" r="9" fill="#d9e3ed"/><circle cx="196" cy="385" r="9" fill="#d9e3ed"/><circle cx="233" cy="385" r="9" fill="#d9e3ed"/><circle cx="270" cy="385" r="9" fill="#d9e3ed"/><circle cx="307" cy="385" r="9" fill="#d9e3ed"/><circle cx="344" cy="385" r="9" fill="#d9e3ed"/><circle cx="381" cy="385" r="9" fill="#d9e3ed"/><circle cx="418" cy="385" r="9" fill="#d9e3ed"/><circle cx="85" cy="413" r="9" fill="#d9e3ed"/><circle cx="122" cy="413" r="9" fill="#d9e3ed"/><circle cx="159" cy="413" r="9" fill="#d9e3ed"/><circle cx="196" cy="413" r="9" fill="#d9e3ed"/><circle cx="233" cy="413" r="9" fill="#d9e3ed"/><circle cx="270" cy="413" r="9" fill="#d9e3ed"/><circle cx="307" cy="413" r="9" fill="#d9e3ed"/><circle cx="344" cy="413" r="9" fill="#d9e3ed"/><circle cx="381" cy="413" r="9" fill="#d9e3ed"/><circle cx="418" cy="413" r="9" fill="#d9e3ed"/><circle cx="85" cy="441" r="9" fill="#d9e3ed"/><circle cx="122" cy="441" r="9" fill="#d9e3ed"/><circle cx="159" cy="441" r="9" fill="#d9e3ed"/><circle cx="196" cy="441" r="9" fill="#d9e3ed"/><circle cx="233" cy="441" r="9" fill="#d9e3ed"/><circle cx="270" cy="441" r="9" fill="#d9e3ed"/><circle cx="307" cy="441" r="9" fill="#d9e3ed"/><circle cx="344" cy="441" r="9" fill="#d9e3ed"/><circle cx="381" cy="441" r="9" fill="#d9e3ed"/><circle cx="418" cy="441" r="9" fill="#d9e3ed"/><circle cx="85" cy="469" r="9" fill="#d9e3ed"/><circle cx="122" cy="469" r="9" fill="#d9e3ed"/><circle cx="159" cy="469" r="9" fill="#d9e3ed"/><circle cx="196" cy="469" r="9" fill="#d9e3ed"/><circle cx="233" cy="469" r="9" fill="#d9e3ed"/><circle cx="270" cy="469" r="9" fill="#d9e3ed"/><circle cx="307" cy="469" r="9" fill="#d9e3ed"/><circle cx="344" cy="469" r="9" fill="#d9e3ed"/><circle cx="381" cy="469" r="9" fill="#d9e3ed"/><circle cx="418" cy="469" r="9" fill="#d9e3ed"/><circle cx="85" cy="497" r="9" fill="#d9e3ed"/><circle cx="122" cy="497" r="9" fill="#d9e3ed"/><circle cx="159" cy="497" r="9" fill="#d9e3ed"/><circle cx="196" cy="497" r="9" fill="#d9e3ed"/><circle cx="233" cy="497" r="9" fill="#d9e3ed"/><circle cx="270" cy="497" r="9" fill="#d9e3ed"/><circle cx="307" cy="497" r="9" fill="#d9e3ed"/><circle cx="344" cy="497" r="9" fill="#d9e3ed"/><circle cx="381" cy="497" r="9" fill="#d9e3ed"/><circle cx="418" cy="497" r="9" fill="#d9e3ed"/><rect x="68" y="225" width="183" height="61" rx="12" fill="none" stroke="#328478" stroke-width="3"/><text x="75" y="535" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17314b">Green dots = sample of 100</text><path d="M 492 270 H 535 l -12 -8 m 12 8 l -12 8" stroke="#328478" stroke-width="4" fill="none"/><rect x="555" y="135" width="400" height="180" rx="16" fill="#e1eee9"/><text x="575" y="175" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17314b">Describe the sample</text><text x="575" y="220" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">60 of 100 use the bus.</text><text x="575" y="260" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17314b">60 / 100 = 60%</text><text x="575" y="292" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">This is descriptive statistics.</text><rect x="555" y="345" width="400" height="205" rx="16" fill="#e5ecfb"/><text x="575" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17314b">Estimate for everyone</text><text x="575" y="425" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">What share of all 1,000</text><text x="575" y="456" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">students uses the bus?</text><text x="575" y="499" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17314b">This is inference.</text><text x="575" y="530" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">An estimate has uncertainty.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">Population = whole group. Sample = subgroup studied.</text><text x="52" y="679" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">Descriptive: observed data. Inferential: extend beyond observed data.</text></svg>