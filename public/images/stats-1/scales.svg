<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Four scales: what comparisons make sense?</text><text x="40" y="88" class="sub">Choose the scale from the meaning of the measurement.</text><rect x="40" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="160" class="label">1  Nominal: names</text><text x="60" y="198" class="small">Blood group: A, B, AB, O</text><text x="60" y="228" class="small">Same / different; no ranking.</text><rect x="510" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="160" class="label">2  Ordinal: ordered names</text><text x="530" y="198" class="small">Poor &lt; Good &lt; Excellent</text><text x="530" y="228" class="small">Order matters; gaps are unknown.</text><rect x="40" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="402" class="label">3  Interval: equal gaps</text><text x="60" y="440" class="small">20°C to 40°C is a 20°C rise.</text><text x="60" y="470" class="small">40°C is NOT twice as hot as 20°C.</text><rect x="510" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="402" class="label">4  Ratio: meaningful zero</text><text x="530" y="440" class="small">2 kg to 4 kg doubles the mass.</text><text x="530" y="470" class="small">0 kg means no mass.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Names → order → equal gaps → meaningful zero.</text><text x="52" y="679" class="small">Numeric category codes do not turn labels into amounts.</text></svg>