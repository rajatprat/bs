<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Read a data table without getting lost</text><text x="40" y="88" class="sub">3 students = 3 cases. 4 columns = 4 recorded variables.</text><rect x="60" y="150" width="880" height="285" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="90" y="195" class="label">Student</text><text x="305" y="195" class="label">Board</text><text x="520" y="195" class="label">Marks / 100</text><text x="735" y="195" class="label">Height (cm)</text><text x="90" y="260" class="small">Asha</text><text x="305" y="260" class="small">CBSE</text><text x="520" y="260" class="small">84</text><text x="735" y="260" class="small">162</text><text x="90" y="325" class="small">Ravi</text><text x="305" y="325" class="small">State</text><text x="520" y="325" class="small">76</text><text x="735" y="325" class="small">170</text><text x="90" y="390" class="small">Noor</text><text x="305" y="390" class="small">CBSE</text><text x="520" y="390" class="small">91</text><text x="735" y="390" class="small">158</text><text x="70" y="490" class="label">Each row = one case (one student)</text><text x="70" y="540" class="label">Each column = one variable (one characteristic)</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">A cell is one value: Asha’s marks are 84 out of 100.</text><text x="52" y="679" class="small">Always record context and units, not just numbers.</text></svg>