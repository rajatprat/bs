l">2</text><text x="747" y="580" class="label">D</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">B is most common: 6 / 15 = 40%. A is 4 / 15 ≈ 26.67%.</text><text x="52" y="679" class="small">For ordinal categories, keep the meaningful category order.</text></svg>