<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Give every number exactly one home</text><text x="40" y="89" font-size="20" font-weight="400">Numerical observations can be counted as values or grouped into intervals.</text><rect x="40" y="125" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="173" r="24" fill="#328478"/><text x="73" y="181" fill="white" style="fill:white" font-size="23">1</text><text x="125" y="162" font-size="24" font-weight="700">Discrete: count values</text><text x="125" y="199" font-size="21" font-weight="400">Household sizes 1, 2, 3, 4, 5 → count each distinct size.</text><rect x="40" y="241" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="289" r="24" fill="#328478"/><text x="73" y="297" fill="white" style="fill:white" font-size="23">2</text><text x="125" y="278" font-size="24" font-weight="700">Continuous: group measurements</text><text x="125" y="315" font-size="21" font-weight="400">Use [30,40), [40,50), [50,60), … to group marks.</text><rect x="40" y="357" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="405" r="24" fill="#328478"/><text x="73" y="413" fill="white" style="fill:white" font-size="23">3</text><text x="125" y="394" font-size="24" font-weight="700">Boundary rule: left in, right out</text><text x="125" y="431" font-size="21" font-weight="400">40 belongs in [40,50), not [30,40).</text><rect x="40" y="473" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="521" r="24" fill="#328478"/><text x="73" y="529" fill="white" style="fill:white" font-size="23">4</text><text x="125" y="510" font-size="24" font-weight="700">Width and midpoint</text><text x="125" y="547" font-size="21" font-weight="400">For [40,50): width = 10, midpoint = (40 + 50) / 2 = 45.</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Classes must not overlap, and must cover all observations.</text><text x="52" y="679" font-size="20" font-weight="400">The total of all frequencies must equal the number of cases.</text></svg>