<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Turn a question into a small investigation</text><text x="40" y="88" class="sub">Example: which board do the admitted students come from?</text><rect x="40" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="160" class="label">1  Ask and collect</text><text x="60" y="198" class="small">Define the students and intake.</text><text x="60" y="228" class="small">Download data or collect responses.</text><rect x="510" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="160" class="label">2  Organize and check</text><text x="530" y="198" class="small">One student per row.</text><text x="530" y="228" class="small">Check missing values and labels.</text><rect x="40" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="402" class="label">3  Select and summarize</text><text x="60" y="440" class="small">Keep the intake you need.</text><text x="60" y="470" class="small">Count students in each board.</text><rect x="510" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="402" class="label">4  Answer with context</text><text x="530" y="440" class="small">Say which group the counts cover.</text><text x="530" y="470" class="small">Do not claim more than data shows.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Filter keeps matching rows. Sort only changes their order.</text><text x="52" y="679" class="small">Always keep an untouched copy of the original data.</text></svg>