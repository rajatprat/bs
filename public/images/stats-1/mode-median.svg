<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Mode and median answer different questions</text><text x="40" y="88" class="sub">15 grades: A × 6, B × 4, C × 3, D × 2.</text><rect x="45" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="62" y="280" class="label">A</text><text x="59" y="340" class="small">1</text><rect x="106" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="123" y="280" class="label">A</text><text x="120" y="340" class="small">2</text><rect x="167" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="184" y="280" class="label">A</text><text x="181" y="340" class="small">3</text><rect x="228" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="245" y="280" class="label">A</text><text x="242" y="340" class="small">4</text><rect x="289" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="306" y="280" class="label">A</text><text x="303" y="340" class="small">5</text><rect x="350" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="367" y="280" class="label">A</text><text x="364" y="340" class="small">6</text><rect x="411" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="428" y="280" class="label">B</text><text x="425" y="340" class="small">7</text><rect x="472" y="230" width="52" height="80" rx="8" fill="#e5ac47"/><text x="489" y="280" class="label">B</text><text x="486" y="340" class="small">8</text><rect x="533" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="550" y="280" class="label">B</text><text x="547" y="340" class="small">9</text><rect x="594" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="611" y="280" class="label">B</text><text x="608" y="340" class="small">10</text><rect x="655" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="672" y="280" class="label">C</text><text x="669" y="340" class="small">11</text><rect x="716" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="733" y="280" class="label">C</text><text x="730" y="340" class="small">12</text><rect x="777" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="794" y="280" class="label">C</text><text x="791" y="340" class="small">13</text><rect x="838" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="855" y="280" class="label">D</text><text x="852" y="340" class="small">14</text><rect x="899" y="230" width="52" height="80" rx="8" fill="#e1e9f1"/><text x="916" y="280" class="label">D</text><text x="913" y="340" class="small">15</text><text x="70" y="165" class="label">Sorted grades: A before B before C before D</text><text x="70" y="415" class="label">MODE = A: appears 6 times (the largest count).</text><text x="70" y="475" class="label">MEDIAN = B: the 8th of 15 ordered observations.</text><text x="70" y="535" class="label">Most common and middle can be different.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Mode asks “which category appears most?”</text><text x="52" y="679" class="small">Median asks “which category sits in the middle after sorting?”</text></svg>