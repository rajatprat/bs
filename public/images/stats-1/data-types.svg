<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">What kind of information is this?</text><text x="40" y="88" class="sub">Ask what the values mean, not what they look like.</text><rect x="40" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="160" class="label">Categorical = a label</text><text x="60" y="198" class="small">Board: CBSE, State, ISC</text><text x="60" y="228" class="small">Blood group: A, B, AB, O</text><text x="60" y="258" class="small">A code such as 1 can be a label.</text><rect x="510" y="120" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="160" class="label">Numerical = an amount</text><text x="530" y="198" class="small">Height: 162 cm</text><text x="530" y="228" class="small">Price: 500 rupees</text><text x="530" y="258" class="small">Differences in amounts make sense.</text><rect x="40" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="60" y="402" class="label">Cross-sectional = a snapshot</text><text x="60" y="440" class="small">Heights of 30 students today.</text><text x="60" y="470" class="small">Many cases at about one time.</text><rect x="510" y="362" width="450" height="220" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="530" y="402" class="label">Time series = a timeline</text><text x="530" y="440" class="small">Chennai temperature each day.</text><text x="530" y="470" class="small">Keep the dates in time order.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Type of value and timing are two different questions.</text><text x="52" y="679" class="small">A dataset can contain both categorical and numerical columns.</text></svg>