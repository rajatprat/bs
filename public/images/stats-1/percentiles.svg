<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Two percentile rules can give different answers</text><text x="40" y="89" font-size="20" font-weight="400">Sorted marks: 35, 38, 47, 58, 61, 66, 68, 68, 70, 79.</text><rect x="40" y="125" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="173" r="24" fill="#328478"/><text x="73" y="181" fill="white" style="fill:white" font-size="23">1</text><text x="125" y="162" font-size="24" font-weight="700">Lecture hand rule: find n × p</text><text x="125" y="199" font-size="21" font-weight="400">For Q1, n × p = 10 × 0.25 = 2.5.</text><rect x="40" y="241" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="289" r="24" fill="#328478"/><text x="73" y="297" fill="white" style="fill:white" font-size="23">2</text><text x="125" y="278" font-size="24" font-weight="700">Round a non-integer position UP</text><text x="125" y="315" font-size="21" font-weight="400">Position 3 → Q1 = 47.</text><rect x="40" y="357" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="405" r="24" fill="#328478"/><text x="73" y="413" fill="white" style="fill:white" font-size="23">3</text><text x="125" y="394" font-size="24" font-weight="700">Spreadsheet interpolation: 1 + (n − 1) × p</text><text x="125" y="431" font-size="21" font-weight="400">Position = 1 + 9 × 0.25 = 3.25.</text><rect x="40" y="473" width="920" height="100" rx="10" fill="#fff"/><circle cx="80" cy="521" r="24" fill="#328478"/><text x="73" y="529" fill="white" style="fill:white" font-size="23">4</text><text x="125" y="510" font-size="24" font-weight="700">Move 25% of the way from position 3 to 4</text><text x="125" y="547" font-size="21" font-weight="400">47 + 0.25 × (58 − 47) = 49.75.</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Both methods appear in the source lecture. Always name the method.</text><text x="52" y="679" font-size="20" font-weight="400">Never mix Q1 from one rule with Q3 from another rule.</text></svg>