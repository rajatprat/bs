<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Count → divide → percent</text><text x="40" y="88" class="sub">Raw data: A, A, B, C, A, D, A, B, D, C</text><rect x="45" y="145" width="910" height="85" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="65" y="195" class="label">A</text><circle cx="170" cy="187" r="14" fill="#328478"/><circle cx="212" cy="187" r="14" fill="#328478"/><circle cx="254" cy="187" r="14" fill="#328478"/><circle cx="296" cy="187" r="14" fill="#328478"/><text x="405" y="195" class="small">4 out of 10</text><text x="650" y="195" class="label">0.4 = 40%</text><rect x="45" y="245" width="910" height="85" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="65" y="295" class="label">B</text><circle cx="170" cy="287" r="14" fill="#328478"/><circle cx="212" cy="287" r="14" fill="#328478"/><text x="405" y="295" class="small">2 out of 10</text><text x="650" y="295" class="label">0.2 = 20%</text><rect x="45" y="345" width="910" height="85" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="65" y="395" class="label">C</text><circle cx="170" cy="387" r="14" fill="#328478"/><circle cx="212" cy="387" r="14" fill="#328478"/><text x="405" y="395" class="small">2 out of 10</text><text x="650" y="395" class="label">0.2 = 20%</text><rect x="45" y="445" width="910" height="85" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="65" y="495" class="label">D</text><circle cx="170" cy="487" r="14" fill="#328478"/><circle cx="212" cy="487" r="14" fill="#328478"/><text x="405" y="495" class="small">2 out of 10</text><text x="650" y="495" class="label">0.2 = 20%</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">Frequency total = 10. Relative frequency total = 1.</text><text x="52" y="679" class="small">Percentage total = 100%. Each case is counted once.</text></svg>