<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Compare groups without hiding their overlap</text><text x="40" y="89" font-size="20" font-weight="400">Lecture marks: dots are students; pink lines show group means.</text><text x="60" y="150" font-size="23" font-weight="400">Marks / 100</text><path d="M180 550 L920 550" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M180 550 L920 550" stroke="#d4dfea" stroke-width="1" fill="none"/><text x="110" y="557" font-size="21" font-weight="400">60</text><path d="M180 470 L920 470" stroke="#d4dfea" stroke-width="1" fill="none"/><text x="110" y="477" font-size="21" font-weight="400">70</text><path d="M180 390 L920 390" stroke="#d4dfea" stroke-width="1" fill="none"/><text x="110" y="397" font-size="21" font-weight="400">80</text><path d="M180 310 L920 310" stroke="#d4dfea" stroke-width="1" fill="none"/><text x="110" y="317" font-size="21" font-weight="400">90</text><path d="M180 230 L920 230" stroke="#d4dfea" stroke-width="1" fill="none"/><text x="110" y="237" font-size="21" font-weight="400">100</text><circle cx="350" cy="462" r="7" fill="#328478"/><circle cx="350" cy="494" r="7" fill="#328478"/><circle cx="350" cy="510" r="7" fill="#328478"/><circle cx="350" cy="302" r="7" fill="#328478"/><circle cx="350" cy="350" r="7" fill="#328478"/><circle cx="350" cy="478" r="7" fill="#328478"/><circle cx="350" cy="430" r="7" fill="#328478"/><circle cx="350" cy="398" r="7" fill="#328478"/><circle cx="350" cy="342" r="7" fill="#328478"/><circle cx="370" cy="430" r="7" fill="#328478"/><circle cx="350" cy="310" r="7" fill="#328478"/><circle cx="370" cy="302" r="7" fill="#328478"/><path d="M290 400.66666666666663 L415 400.66666666666663" stroke="#ce7392" stroke-width="4" fill="none"/><text x="255" y="590" font-size="23" font-weight="700">F: 12 students</text><text x="255" y="180" font-size="21" font-weight="400">Mean = 78.667</text><circle cx="710" cy="478" r="7" fill="#328478"/><circle cx="710" cy="430" r="7" fill="#328478"/><circle cx="710" cy="366" r="7" fill="#328478"/><circle cx="710" cy="294" r="7" fill="#328478"/><circle cx="710" cy="462" r="7" fill="#328478"/><circle cx="710" cy="278" r="7" fill="#328478"/><circle cx="710" cy="358" r="7" fill="#328478"/><circle cx="710" cy="310" r="7" fill="#328478"/><path d="M650 372.0 L775 372.0" stroke="#ce7392" stroke-width="4" fill="none"/><text x="615" y="590" font-size="23" font-weight="700">M: 8 students</text><text x="615" y="180" font-size="21" font-weight="400">Mean = 82.250</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">F mean ≈ 78.667. M mean = 82.25. Individual marks overlap.</text><text x="52" y="679" font-size="20" font-weight="400">A difference in this class does not establish a cause or a universal rule.</text></svg>