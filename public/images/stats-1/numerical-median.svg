<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Sort first. Then find the middle.</text><text x="40" y="89" font-size="20" font-weight="400">These are numerical values, so averaging two middle values makes sense.</text><text x="65" y="155" font-size="26" font-weight="700">Odd: 7 values → position 4</text><rect x="90" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="120" y="239" font-size="29" font-weight="700">2</text><text x="128" y="300" font-size="20" font-weight="400">1</text><rect x="215" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="245" y="239" font-size="29" font-weight="700">3</text><text x="253" y="300" font-size="20" font-weight="400">2</text><rect x="340" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="370" y="239" font-size="29" font-weight="700">5</text><text x="378" y="300" font-size="20" font-weight="400">3</text><rect x="465" y="190" width="95" height="75" rx="10" fill="#e5ac47"/><text x="495" y="239" font-size="29" font-weight="700">6</text><text x="503" y="300" font-size="20" font-weight="400">4</text><rect x="590" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="620" y="239" font-size="29" font-weight="700">7</text><text x="628" y="300" font-size="20" font-weight="400">5</text><rect x="715" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="745" y="239" font-size="29" font-weight="700">7</text><text x="753" y="300" font-size="20" font-weight="400">6</text><rect x="840" y="190" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="870" y="239" font-size="29" font-weight="700">12</text><text x="878" y="300" font-size="20" font-weight="400">7</text><text x="65" y="365" font-size="26" font-weight="700">Even: 6 values → average positions 3 and 4</text><rect x="135" y="400" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="155" y="449" font-size="29" font-weight="700">2</text><rect x="260" y="400" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="280" y="449" font-size="29" font-weight="700">3</text><rect x="385" y="400" width="95" height="75" rx="10" fill="#e5ac47"/><text x="405" y="449" font-size="29" font-weight="700">5</text><rect x="510" y="400" width="95" height="75" rx="10" fill="#e5ac47"/><text x="530" y="449" font-size="29" font-weight="700">6</text><rect x="635" y="400" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="655" y="449" font-size="29" font-weight="700">7</text><rect x="760" y="400" width="95" height="75" rx="10" fill="#e1e9f1"/><text x="780" y="449" font-size="29" font-weight="700">105</text><text x="260" y="555" font-size="30" font-weight="700">Median = (5 + 6) / 2 = 5.5</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Odd n: position (n + 1) / 2. Even n: average positions n/2 and n/2 + 1.</text><text x="52" y="679" font-size="20" font-weight="400">Do not use this averaging rule on nominal or ordinal category codes.</text></svg>