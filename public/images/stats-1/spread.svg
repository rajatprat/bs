<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">The center does not tell the whole story</text><text x="40" y="89" font-size="20" font-weight="400">Compare 3,3,3,3,3 with 1,2,3,4,5.</text><text x="65" y="155" font-size="27" font-weight="700">Same center, no spread</text><path d="M110 220 L900 220" stroke="#9aafbf" stroke-width="2" fill="none"/><text x="100" y="260" font-size="22" font-weight="400">1</text><text x="290" y="260" font-size="22" font-weight="400">2</text><text x="480" y="260" font-size="22" font-weight="400">3</text><text x="670" y="260" font-size="22" font-weight="400">4</text><text x="860" y="260" font-size="22" font-weight="400">5</text><circle cx="490" cy="201" r="8" fill="#328478"/><circle cx="490" cy="182" r="8" fill="#328478"/><circle cx="490" cy="163" r="8" fill="#328478"/><circle cx="490" cy="144" r="8" fill="#328478"/><circle cx="490" cy="125" r="8" fill="#328478"/><text x="65" y="365" font-size="27" font-weight="700">Same center, more spread</text><path d="M110 430 L900 430" stroke="#9aafbf" stroke-width="2" fill="none"/><text x="100" y="470" font-size="22" font-weight="400">1</text><text x="290" y="470" font-size="22" font-weight="400">2</text><text x="480" y="470" font-size="22" font-weight="400">3</text><text x="670" y="470" font-size="22" font-weight="400">4</text><text x="860" y="470" font-size="22" font-weight="400">5</text><circle cx="110" cy="411" r="8" fill="#328478"/><circle cx="300" cy="411" r="8" fill="#328478"/><circle cx="490" cy="411" r="8" fill="#328478"/><circle cx="680" cy="411" r="8" fill="#328478"/><circle cx="870" cy="411" r="8" fill="#328478"/><text x="110" y="575" font-size="27" font-weight="700">Both means = 3. Ranges: 0 and 4.</text><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Range = maximum − minimum. It uses only the two extremes.</text><text x="52" y="679" font-size="20" font-weight="400">Variance and standard deviation account for every observation.</text></svg>