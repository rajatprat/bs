<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}</style><text x="40" y="52" font-size="31" font-weight="700">Describe the pattern before computing</text><text x="40" y="89" font-size="20" font-weight="400">Illustrative scatterplots; the panels show shapes, not measured units.</text><rect x="45" y="130" width="445" height="215" rx="10" fill="#fff"/><text x="60" y="162" font-size="21" font-weight="700">Positive, roughly linear</text><path d="M90 305 L450 305" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M90 305 L90 185" stroke="#9aafbf" stroke-width="2" fill="none"/><circle cx="165" cy="287" r="7" fill="#328478"/><circle cx="225" cy="259.4" r="7" fill="#328478"/><circle cx="285" cy="250.2" r="7" fill="#328478"/><circle cx="345" cy="218" r="7" fill="#328478"/><circle cx="405" cy="206.5" r="7" fill="#328478"/><rect x="525" y="130" width="445" height="215" rx="10" fill="#fff"/><text x="540" y="162" font-size="21" font-weight="700">Negative, roughly linear</text><path d="M570 305 L930 305" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M570 305 L570 185" stroke="#9aafbf" stroke-width="2" fill="none"/><circle cx="645" cy="195" r="7" fill="#328478"/><circle cx="705" cy="220.3" r="7" fill="#328478"/><circle cx="765" cy="236.39999999999998" r="7" fill="#328478"/><circle cx="825" cy="264" r="7" fill="#328478"/><circle cx="885" cy="287" r="7" fill="#328478"/><rect x="45" y="365" width="445" height="215" rx="10" fill="#fff"/><text x="60" y="397" font-size="21" font-weight="700">Curved, still associated</text><path d="M90 540 L450 540" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M90 540 L90 420" stroke="#9aafbf" stroke-width="2" fill="none"/><circle cx="165" cy="430" r="7" fill="#328478"/><circle cx="225" cy="499" r="7" fill="#328478"/><circle cx="285" cy="522" r="7" fill="#328478"/><circle cx="345" cy="499" r="7" fill="#328478"/><circle cx="405" cy="430" r="7" fill="#328478"/><rect x="525" y="365" width="445" height="215" rx="10" fill="#fff"/><text x="540" y="397" font-size="21" font-weight="700">Linear with an unusual point</text><path d="M570 540 L930 540" stroke="#9aafbf" stroke-width="2" fill="none"/><path d="M570 540 L570 420" stroke="#9aafbf" stroke-width="2" fill="none"/><circle cx="645" cy="522" r="7" fill="#328478"/><circle cx="705" cy="499" r="7" fill="#328478"/><circle cx="765" cy="476" r="7" fill="#328478"/><circle cx="825" cy="453" r="7" fill="#328478"/><circle cx="885" cy="522" r="7" fill="#328478"/><rect x="32" y="624" width="936" height="70" rx="10" fill="#dcefe9"/><text x="52" y="652" font-size="20" font-weight="400">Direction → curvature → variation around the pattern → unusual points.</text><text x="52" y="679" font-size="20" font-weight="400">A curved relationship may have a correlation close to zero.</text></svg>