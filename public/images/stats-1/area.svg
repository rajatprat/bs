<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17314b">A picture can make a small change look huge</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">Illustrative counts rise from 10 to 20. Compare the visible areas.</text><text x="55" y="155" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17314b">Fair: area doubles</text><text x="540" y="155" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17314b">Misleading: area quadruples</text><rect x="70" y="350" width="80" height="80" fill="#328478" rx="4"/><text x="70" y="465" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17314b">10 cases</text><rect x="230" y="270" width="80" height="160" fill="#507dd0" rx="4"/><text x="230" y="465" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17314b">20 cases</text><rect x="555" y="350" width="80" height="80" fill="#328478" rx="4"/><text x="555" y="465" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17314b">10 cases</text><rect x="720" y="270" width="160" height="160" fill="#507dd0" rx="4"/><text x="720" y="465" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17314b">20 cases</text><text x="70" y="235" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">Same width</text><text x="230" y="220" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">Height × 2</text><text x="720" y="225" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">Width × 2</text><text x="720" y="255" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17314b">Height × 2</text><text x="70" y="520" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17314b">1 × 2 = 2 times the area</text><text x="555" y="520" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17314b">2 × 2 = 4 times the area</text><text x="70" y="568" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17314b">The count doubled. Only the left display shows a proportional area.</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">The area principle: visible area should match the amount of data.</text><text x="52" y="679" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#17314b">Avoid resizing icons in both directions or using 3D effects.</text></svg>