<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" rx="24" fill="#f5f8fc"/><style>text{font-family:Arial,sans-serif;fill:#17314b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526778}.label{font-size:24px;font-weight:700}.small{font-size:20px}.big{font-size:38px;font-weight:700}</style><text x="40" y="52" class="title">Same numbers. Very different impression.</text><text x="40" y="88" class="sub">Illustrative counts: North = 100, South = 110.</text><rect x="45" y="125" width="450" height="450" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="65" y="170" class="label">Misleading: starts at 90</text><text x="60" y="506.0" class="small">90</text><path d="M 110 500.0 H 455" stroke="#cfdae5"/><text x="60" y="376.0" class="small">100</text><path d="M 110 370.0 H 455" stroke="#cfdae5"/><text x="60" y="246.0" class="small">110</text><path d="M 110 240.0 H 455" stroke="#cfdae5"/><rect x="160" y="370.0" width="80" height="130.0" fill="#328478"/><text x="170" y="358.0" class="small">100</text><text x="165" y="540" class="small">North</text><rect x="305" y="240.0" width="80" height="260.0" fill="#507dd0"/><text x="315" y="228.0" class="small">110</text><text x="310" y="540" class="small">South</text><rect x="525" y="125" width="450" height="450" rx="14" fill="#fff" stroke="#ccd9e6"/><text x="545" y="170" class="label">Fair: starts at 0</text><text x="540" y="506.0" class="small">0</text><path d="M 590 500.0 H 935" stroke="#cfdae5"/><text x="540" y="387.8181818181818" class="small">50</text><path d="M 590 381.8181818181818 H 935" stroke="#cfdae5"/><text x="540" y="269.6363636363636" class="small">100</text><path d="M 590 263.6363636363636 H 935" stroke="#cfdae5"/><rect x="640" y="263.6363636363636" width="80" height="236.36363636363637" fill="#328478"/><text x="650" y="251.63636363636363" class="small">100</text><text x="645" y="540" class="small">North</text><rect x="785" y="240.0" width="80" height="260.0" fill="#507dd0"/><text x="795" y="228.0" class="small">110</text><text x="790" y="540" class="small">South</text><rect x="32" y="624" width="936" height="70" rx="14" fill="#dcefe9"/><text x="52" y="652" class="small">The true increase is 10 / 100 = 10%, not 100%.</text><text x="52" y="679" class="small">Bar lengths must be measured from zero for a fair comparison.</text></svg>